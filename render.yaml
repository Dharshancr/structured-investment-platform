services:
  - type: web
    name: structured-investment-api
    runtime: docker
    plan: starter
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: postgresql+psycopg://postgres:postgres@localhost:5432/structured_investments
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ENVIRONMENT
        value: production

